[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netflix2trakt"
version = "1.0.0"
description = "Convert Netflix viewing history into a Trakt.tv import CSV, backed by TMDB. No dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Thomas Ott" }]
keywords = ["netflix", "trakt", "tmdb", "csv", "viewing-history", "import", "scrobble"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/RedBoardDev/netflix2trakt"
Repository = "https://github.com/RedBoardDev/netflix2trakt"
Issues = "https://github.com/RedBoardDev/netflix2trakt/issues"

[project.scripts]
netflix2trakt = "netflix2trakt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/netflix2trakt"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
